name: Public Mirror Policy

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: public-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-policy:
    name: Documentation boundary and links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Check public documentation
        run: python3 .github/scripts/check_public_docs.py --root .
