name: Public Mirror Policy

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: public-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-policy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install pinned validators
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r requirements-public.txt
      - name: Run framework and refusal tests
        shell: pwsh
        run: python -m unittest Tests.policy.test_stage1_control_plane Tools.COAPI.Public.test_audit_public_export
      - name: Audit exact tracked tree
        shell: pwsh
        run: python Tools/COAPI/Public/audit_public_export.py staged --repository . --patterns .publicmirror/public-content-deny-patterns.json
      - name: Verify deterministic manifest
        shell: pwsh
        run: python Tools/COAPI/Public/audit_public_export.py verify --root .
